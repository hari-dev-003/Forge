<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Forge</title>
    <meta name="description" content="Log verified client meetings, earn points on approval, and climb the leaderboard." />

    <!-- Typeface: Clash Grotesk (Fontshare / Indian Type Foundry).
         Only 400/500/600/700 are requested — those are the four weights the
         type scale uses. 200/300 are deliberately excluded: at the 11-13px
         sizes this UI leans on, ExtraLight and Light lose too much stroke
         against a dark background to stay legible, so shipping them would only
         add payload and invite misuse. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the app background so the browser chrome blends with the shell. -->
    <meta name="theme-color" content="#0a0a0c" />

    <!-- Icons — generated from src/assets/forge-icon.jpeg by `npm run brand`.
         No SVG favicon: the mark is a raster master, so a hand-drawn SVG
         stand-in would just be a different logo at small sizes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS standalone / Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
